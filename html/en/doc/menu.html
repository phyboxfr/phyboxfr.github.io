<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>Menu</title>
    <link type="text/css" rel="stylesheet" href="/phybox.css">
    <script type="application/x-javascript" src="/phybox.js"></script>
  </head>
  <body> 
    <div id="Menu" class="h">
      <ul class="menu">
        <li><a href="home.html"   onclick="set(this);return false;" id="Home"></a></li>
        <li><a href="text.html"   onclick="set(this);return false;">Text</a></li>
        <li><a href="pdf.html"    onclick="set(this);return false;">Pdf</a></li>
        <li><a href="table.html"  onclick="set(this);return false;">Spreadsheet</a></li>
        <li><a href="slide.html"  onclick="set(this);return false;">Slide</a></li>
        <li><a href="image.html"  onclick="set(this);return false;">Image</a></li>
        <li><a href="audio.html"  onclick="set(this);return false;">Audio</a></li>
        <li><a href="flash.html"  onclick="set(this);return false;">Flash</a></li>
        <li><a href="h5p.html"    onclick="set(this);return false;">H5P</a></li>
      </ul>
    </div>
    <script>
       //Set Html Frame with href
       function set(e){ 
          parent.set(e.href);
          active(e);
          return false;
       }
       //Set active li with index | element
       function active(e){ 
          let active = document.querySelector('li.active');
          if(active) active.classList.remove('active');
          if( typeof e == 'number' ) e = document.querySelector('ul').children[e].firstElementChild;
          e.parentElement.classList.add('active');
       }
       //Return li.active index to Main
       function get(){
          let active = document.querySelector('ul li.active');
          return active ? [ ...active.parentElement.children].indexOf(active) : 0;
       }
    </script>
  </body>
</html>
