<!DOCTYPE html>
<html lang="fr">
  <head>

    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>Menu</title>
    <link type="text/css"  rel="stylesheet" href="/phybox.css">
    <script type="application/x-javascript" src="/phybox.js"></script>
  </head>

  <body class="h">

    <div id="Menu" class="h">

      <ul class="menu">
        <li><a href="home.html"     onclick="set(this);return false;" id="Home"></a></li>
        <li><a href="speech.html"   onclick="set(this);return false;">Adaptation</a></li>
        <li><a href="vocal.html"    onclick="set(this);return false;">Vocal</a></li>
        <li><a href="crawl.html"    onclick="set(this);return false;">Capture</a></li>
        <li><a href="send.html"     onclick="set(this);return false;">Send</a></li>
      </ul>
    </div>

    <script>
       function set(e){ 
          parent.set(e.href);
          active(e);
          return false;
       }
       function active(e){ 
          let active = document.querySelector('li.active');
          if(active) active.classList.remove('active');
          if( typeof e == 'number' ) e = document.querySelector('ul').children[e].firstElementChild;
          e.parentElement.classList.add('active');
       }
       function get(){
          let active = document.querySelector('ul li.active');
          return active ? [ ...active.parentElement.children].indexOf(active) : 0;
       } 
    </script>

  </body>
</html>
