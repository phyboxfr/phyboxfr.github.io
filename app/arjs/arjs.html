<!DOCTYPE html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>AR.js</title>   
    </head> 

    <script src="../../app/arjs/js/aframe.1.0.4.min.js"></script>
    <script src="../../app/arjs/js/aframe-ar.js"></script>

  </head>

  <body class="h" style="margin : 0px; overflow: hidden;">

      <!-- A-Frame must be set before any other html element or ar object are shifted on screen -->

     <a-scene embedded arjs='sourceType: webcam; cameraParametersUrl:../../app/arjs/data/camera_para.dat; debugUIEnabled: false; maxDetectionRate: 30; detectionMode: mono_and_matrix; matrixCodeType: 3x3;' style="width:100%;margin:auto;">
     <!--                    
      <a-scene embedded arjs='sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3;'>                                
      -->
         <a-marker type='barcode' value='0'><a-entity gltf-model="../../app/arjs/model/o2.glb" scale="0.6 0.6 0.6"></a-entity></a-marker>
         <a-marker type='barcode' value='1'><a-entity gltf-model="../../app/arjs/model/n2.glb" scale="0.6 0.6 0.6"></a-entity></a-marker>
         <a-marker type='barcode' value='2'><a-entity gltf-model="../../app/arjs/model/eau.glb" scale="0.6 0.6 0.6" rotation="20 200 90"></a-entity></a-marker>
         <a-marker type='barcode' value='3'><a-entity gltf-model="../../app/arjs/model/co2.glb" scale="0.4 0.6 0.4"></a-entity></a-marker>
         <a-marker type='barcode' value='4'><a-entity gltf-model="../../app/arjs/model/so2.glb" scale="0.4 0.4 0.4" rotation="90 90 90"></a-entity></a-marker>
         <a-marker type='barcode' value='5'><a-entity gltf-model="../../app/arjs/model/ch4.glb" scale="0.6 0.6 0.6"></a-entity></a-marker>
         <a-marker type='barcode' value='6'><a-entity gltf-model="../../app/arjs/model/nh4.glb" scale="0.6 0.6 0.6" rotation="10 50 100"></a-entity></a-marker>
         <a-marker type='barcode' value='7'><a-entity gltf-model="../../app/arjs/model/ethanol.glb" scale="0.6 0.6 0.6" rotation="-20 100 30"></a-entity></a-marker>
   
         <a-entity camera='fov:45;'></a-entity>
    
    </a-scene>
  
  </body>
</html>
