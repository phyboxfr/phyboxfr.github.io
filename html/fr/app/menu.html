<!DOCTYPE html>
<html lang="fr">

  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>Menu</title>
    <link type="text/css" rel="stylesheet" href="/phybox.css">
    <script type="application/x-javascript" src="/phybox.js"></script>
  </head>

  <body> 

    <div id="Menu" class="h">
      <ul class="menu">
        <li><a href="home.html"   onclick="set(this);return false;" id="Home"></a></li>
        <li><a href="wiki.html"   onclick="set(this);return false;">Librairie</a></li>
        <li><a href="news.html"   onclick="set(this);return false;">Actu</a></li>
        <li><a href="board.html"  onclick="set(this);return false;">Tableau</a></li>
        <li><a href="quiz.html"   onclick="set(this);return false;">Quiz</a></li>
        <li><a href="edit.html"   onclick="set(this);return false;">Éditeur</a></li>
        <li><a href="draw.html"   onclick="set(this);return false;">Dessin</a></li>
        <li><a href="photo.html"  onclick="set(this);return false;">Photo</a></li>
        <li><a href="audio.html"  onclick="set(this);return false;">Audio</a></li>
     </ul>
    </div>

    <script>
       function set(e){ 
          parent.set(e.href);
          active(e);
          return false;
       }
       function active(e){ 
          let active = document.querySelector('li.active');
          if(active) active.classList.remove('active');
          if( typeof e == 'number' ) e = document.querySelector('ul').children[e].firstElementChild;
          e.parentElement.classList.add('active');
       }
       function get(){
          let active = document.querySelector('ul li.active');
          return active ? [ ...active.parentElement.children].indexOf(active) : 0;
       }
    </script>

  </body>
</html>
