<!DOCTYPE html>
<html lang="fr">

  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <title>Menu</title>
    <link type="text/css" rel="stylesheet" href="/phybox.css">
    <script type="application/x-javascript" src="/phybox.js"></script>
  </head>

  <body> 

    <div id="Menu" class="h">
      <ul class="menu">
        <li><a href="home.html"     onclick="set(this);return false;" id="Home"></a></li>
        <li><a href="unit.html"     onclick="set(this);return false;">Unités</a></li>
        <li><a href="diagram.html"  onclick="set(this);return false;">Schéma</a></li>
        <li><a href="tracker.html"  onclick="set(this);return false;">Mouvement</a></li>
        <li><a href="molecule.html" onclick="set(this);return false;">Molécules</a></li>
        <li><a href="vr.html"       onclick="set(this);return false;">VR</a></li>
        <li><a href="ar.html"       onclick="set(this);return false;">AR</a></li> 
      </ul>
    </div>

    <script>
       function set(e){ 
          parent.set(e.href);
          active(e);
          return false;
       }
       function active(e){ 
          let active = document.querySelector('li.active');
          if(active) active.classList.remove('active');
          if( typeof e == 'number' ) e = document.querySelector('ul').children[e].firstElementChild;
          e.parentElement.classList.add('active');
       }
       function get(){
          let active = document.querySelector('ul li.active');
          return active ? [ ...active.parentElement.children].indexOf(active) : 0;
       } 
    </script>

  </body>
</html>
